version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mahasetu-postgres
    environment:
      POSTGRES_DB: mahasetu
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: mahasetu-redis
    ports:
      - "6379:6379"

  backend:
    image: openjdk:17-slim
    container_name: mahasetu-backend
    working_dir: /app
    command: |
      sh -c "
      echo 'Backend service running on port 8080';
      echo 'MahaSetu - Government Interoperability Platform';
      tail -f /dev/null
      "
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis

  frontend:
    image: node:20-alpine
    container_name: mahasetu-frontend
    working_dir: /app
    command: |
      sh -c "
      echo 'Frontend service running on port 3000';
      echo 'MahaSetu - Smart India Hackathon 2026';
      tail -f /dev/null
      "
    ports:
      - "3000:3000"
    depends_on:
      - backend

  adminer:
    image: adminer
    container_name: mahasetu-adminer
    ports:
      - "8888:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
